permissions:
  contents: read
name: (Prod) Build and deploy

on:
  push:
    tags:
      # Only build and deploy when a new tag is created matching a semantic version.
      - 'v[0-9]+.[0-9]+.[0-9]+'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Use pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install dependencies
        run: |
          pnpm install

      - name: Build Nuxt.js application
        run: |
          pnpm run build
        env:
          NUXT_APP_BASE_URL: /gstream3/
          GDOC_ENV: prod

      - name: Prepare Lambda Web Adapter entrypoint
        run: |
          cat > .output/run.sh <<'EOF'
          #!/bin/sh
          exec node /var/task/server/bootstrap.mjs
          EOF
          cat > .output/server/bootstrap.mjs <<'EOF'
          import { GetParameterCommand, SSMClient } from '@aws-sdk/client-ssm'

          const parameterName = process.env.MONGODB_URI_PARAMETER
          if (!parameterName) {
            throw new Error('MONGODB_URI_PARAMETER is not configured')
          }

          const ssm = new SSMClient({})
          const result = await ssm.send(new GetParameterCommand({
            Name: parameterName,
            WithDecryption: true
          }))
          const uri = result.Parameter?.Value
          if (!uri) {
            throw new Error(`SSM parameter "${parameterName}" has no value`)
          }

          process.env.MONGODB_URI = uri
          process.env.NUXT_MONGOOSE_URI = uri
          await import('./index.mjs')
          EOF
          chmod +x .output/run.sh

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Set up AWS SAM CLI
        uses: aws-actions/setup-sam@v2
        with:
          use-installer: true

      - name: SAM Build
        run: |
          sam build --template-file template.yml

      - name: SAM Deploy
        run: |
          sam deploy \
            --template-file .aws-sam/build/template.yaml \
            --stack-name gstream3-prod \
            --region "${{ secrets.AWS_REGION }}" \
            --resolve-s3 \
            --capabilities CAPABILITY_IAM \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset \
            --parameter-overrides "MongoDbUriParameter=/gstream3/prod/mongodb-uri" \
            --tags Environment=prod