permissions:
  contents: read
name: (Prod) Build and deploy

on:
  push:
    tags:
      # Only build and deploy when a new tag is created matching a semantic version.
      - 'v[0-9]+.[0-9]+.[0-9]+'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Use pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install dependencies
        run: |
          pnpm install

      - name: Create .env file
        run: |
          echo AWS_ACCESS_KEY_ID=${{ secrets.AWS_ACCESS_KEY_ID }} >> .env
          echo AWS_SECRET_ACCESS_KEY=${{ secrets.AWS_SECRET_ACCESS_KEY }} >> .env
          echo AWS_DEFAULT_REGION=${{ secrets.AWS_REGION }} >> .env
          echo NUXT_PUBLIC_GDOC_ENV=prod >> .env
          echo MONGODB_URI=${{ secrets.MONGODB_URI }} >> .env

      - name: Build Nuxt.js application
        run: |
          pnpm run build
        env:
          NUXT_APP_BASE_URL: /gstream3/

      - name: Prepare Lambda Web Adapter entrypoint
        run: |
          cat > .output/run.sh <<'EOF'
          #!/bin/sh
          exec node /var/task/server/index.mjs
          EOF
          chmod +x .output/run.sh

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Set up AWS SAM CLI
        uses: aws-actions/setup-sam@v2
        with:
          use-installer: true

      - name: SAM Build
        run: |
          sam build --template-file template.yml

      - name: SAM Deploy
        run: |
          sam deploy \
            --template-file .aws-sam/build/template.yaml \
            --stack-name gstream3-prod \
            --region "${{ secrets.AWS_REGION }}" \
            --resolve-s3 \
            --capabilities CAPABILITY_IAM \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset \
            --tags Environment=prod