AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31

Parameters:
  MongoDbUriParameter:
    Type: String
    Default: /gstream3/prod/mongodb-uri

Resources:
  SimpleFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .output/
      Handler: run.sh
      Runtime: nodejs22.x
      MemorySize: 1024
      Timeout: 30
      Layers:
        - !Sub arn:aws:lambda:${AWS::Region}:753240598075:layer:LambdaAdapterLayerX86:30
      Environment:
        Variables:
          AWS_LAMBDA_EXEC_WRAPPER: /opt/bootstrap
          PORT: 8080
          MONGODB_URI: !Sub '{{resolve:ssm-secure:${MongoDbUriParameter}}}'
          NUXT_MONGOOSE_URI: !Sub '{{resolve:ssm-secure:${MongoDbUriParameter}}}'
      FunctionUrlConfig:
        AuthType: NONE
        Cors:
          AllowOrigins:
            - https://metadata.un.org
          AllowMethods:
            - GET
            - HEAD
          AllowHeaders:
            - Content-Type

Outputs:
  FunctionUrl:
    Description: Public Lambda Function URL
    Value: !GetAtt SimpleFunctionUrl.FunctionUrl
